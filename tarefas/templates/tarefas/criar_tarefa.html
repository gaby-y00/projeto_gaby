<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nova Tarefa</title>
</head>
<body>
    <h1>Cadastrar Nova Tarefa</h1>
    
    <form method="POST">
        {% csrf_token %}
        <p>Preencha as informações abaixo:</p>
        
        <div>
            <label>Título:</label><br>
            <input type="text" name="titulo" required>
        </div>

        <div>
            <label>Categoria:</label><br>
            <select name="categoria" id="categoria">
                <option value="Estudo">Estudo</option>
                <option value="Pessoal">Pessoal</option>
                <option value="Financeiro">Financeiro</option>
                <option value="Compromisso">Compromisso</option>    
            </select>
        </div>

        <div>
            <label>Nível de Prioridade:</label><br>
            <select name="prioridade" id="id_prioridade" required>
                <option value="U">Urgente</option>
                <option value="M">Médio</option>
                <option value="F">Flexível</option>
            </select>
        </div>

        <div>
            <label>Descrição:</label><br>
            <textarea name="descricao" rows="5"></textarea>
        </div>

        <div>
            <label>Repetição / Frequência:</label><br>
            <select name="recorrencia" id="id_recorrencia">
                <option value="nao_repete">Não se repete (Única)</option>
                <option value="diaria">Todos os dias</option>
                <option value="semanal">Toda semana</option>
                <option value="mensal">Todo mês</option>
            </select>
        </div>

        <div id="bloco_data">
            <label>Data:</label><br>
            <input type="date" name="data" id="id_data" required>
        </div>
        
        <button type="submit">Salvar Tarefa</button>
    </form>

    <br>
    <a href="/">Voltar para a home</a>

    <script>
        const selectRecorrencia = document.getElementById('id_recorrencia');
        const blocoData = document.getElementById('bloco_data');
        const inputData = document.getElementById('id_data');

        selectRecorrencia.addEventListener('change', function() {
            if (this.value === 'diaria') {
                blocoData.style.display = 'none';  // Esconde o bloco de data
                inputData.required = false;         // Tira a obrigatoriedade
                inputData.value = '';               // Limpa qualquer data selecionada
            } else {
                blocoData.style.display = 'block'; // Mostra o bloco novamente
                inputData.required = true;          // Torna obrigatório para as outras opções
            }
        });
    </script>
</body>
</html>
