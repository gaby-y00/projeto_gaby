{% extends 'tarefas/base.html' %} 

{% block title %}Nova Tarefa{% endblock %}

{% block content %}
    <div class="bloco-formulario">
        
        <div class="form-header">
            <h2>Cadastrar Nova Tarefa</h2>
            <p class="subtitulo">Preencha as informações abaixo para organizar sua nova tarefa.</p>
        </div>
        
        <div class="form-body">
            <form method="POST" class="form-tarefa">
                {% csrf_token %}
                
                <div class="form-row">
                    <div class="form-group" style="flex: 100%;">
                        <label>Título da Tarefa</label>
                        <input type="text" name="titulo" class="form-control" required placeholder="Ex: Estudar lógica de programação">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Categoria</label>
                        <select name="categoria" id="categoria" class="form-control">
                            <option value="Estudo">Estudo</option>
                            <option value="Pessoal">Pessoal</option>
                            <option value="Financeiro">Financeiro</option>
                            <option value="Compromisso">Compromisso</option>    
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Prioridade</label>
                        <select name="prioridade" id="id_prioridade" class="form-control" required>
                            <option value="U">Urgente</option>
                            <option value="M" selected>Médio</option>
                            <option value="F">Flexível</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex: 100%;">
                        <label>Descrição Detalhada</label>
                        <textarea name="descricao" class="form-control" placeholder="Adicione detalhes, links ou observações importantes aqui..."></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Repetição</label>
                        <select name="recorrencia" id="id_recorrencia" class="form-control">
                            <option value="nao_repete">Não se repete (Única)</option>
                            <option value="diaria">Todos os dias</option>
                            <option value="semanal">Toda semana</option>
                            <option value="mensal">Todo mês</option>
                        </select>
                    </div>

                    <div class="form-group" id="bloco_data">
                        <label>Data de Execução</label>
                        <input type="date" name="data" id="id_data" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-actions">
                    <a href="{% url 'home' %}" class="btn-cancelar">Cancelar</a>
                    <button type="submit" class="btn-salvar">Salvar Tarefa</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const selectRecorrencia = document.getElementById('id_recorrencia');
        const blocoData = document.getElementById('bloco_data');
        const inputData = document.getElementById('id_data');

        selectRecorrencia.addEventListener('change', function() {
            if (this.value === 'diaria') {
                blocoData.style.display = 'none';  
                inputData.required = false;        
                inputData.value = '';              
            } else {
                blocoData.style.display = 'flex'; // Mantém o alinhamento correto
                inputData.required = true;          
            }
        });
    </script>
{% endblock %}
