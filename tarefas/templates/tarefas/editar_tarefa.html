{% extends 'tarefas/base.html' %}

{% block title %}Editar Tarefa - {{ tarefa.titulo }}{% endblock %}

{% block content %}
    <div class="bloco-formulario">
        
        <div class="form-header">
            <h2>Editar Tarefa</h2>
            <p class="subtitulo">Altere as informações abaixo para atualizar os dados da sua tarefa.</p>
        </div>

        <div class="form-body">
            <form method="POST" class="form-tarefa">
                {% csrf_token %}
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="id_titulo">Título da Tarefa</label>
                        <input type="text" id="id_titulo" name="titulo" value="{{ tarefa.titulo }}" required class="form-control" placeholder="Ex: Estudar lógica de programação">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="id_categoria">Categoria</label>
                        <select name="categoria" id="id_categoria" class="form-control">
                            <option value="Estudo" {% if tarefa.categoria == 'Estudo' %}selected{% endif %}>Estudo</option>
                            <option value="Pessoal" {% if tarefa.categoria == 'Pessoal' %}selected{% endif %}>Pessoal</option>
                            <option value="Financeiro" {% if tarefa.categoria == 'Financeiro' %}selected{% endif %}>Financeiro</option>
                            <option value="Compromisso" {% if tarefa.categoria == 'Compromisso' %}selected{% endif %}>Compromisso</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="id_prioridade">Prioridade</label>
                        <select name="prioridade" id="id_prioridade" class="form-control">
                            <option value="Urgente" {% if tarefa.prioridade == 'Urgente' or tarefa.prioridade == 'U' %}selected{% endif %}>Urgente</option>
                            <option value="Médio" {% if tarefa.prioridade == 'Médio' or tarefa.prioridade == 'M' %}selected{% endif %}>Médio</option>
                            <option value="Fraco" {% if tarefa.prioridade == 'Fraco' or tarefa.prioridade == 'F' %}selected{% endif %}>Fraco</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="id_descricao">Descrição Detalhada</label>
                        <textarea name="descricao" id="id_descricao" class="form-control" placeholder="Adicione detalhes, links ou observações importantes aqui...">{{ tarefa.descricao }}</textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="id_recorrencia">Repetição / Frequência</label>
                        <select name="recorrencia" id="id_recorrencia" class="form-control">
                            <option value="nao_repete" {% if tarefa.recorrencia == 'nao_repete' %}selected{% endif %}>Não se repete (Única)</option>
                            <option value="diaria" {% if tarefa.recorrencia == 'diaria' %}selected{% endif %}>Todos os dias</option>
                            <option value="semanal" {% if tarefa.recorrencia == 'semanal' %}selected{% endif %}>Toda semana</option>
                            <option value="mensal" {% if tarefa.recorrencia == 'mensal' %}selected{% endif %}>Todo mês</option>
                        </select>
                    </div>

                    <div class="form-group" id="bloco_data">
                        <label for="id_data">Data de Execução</label>
                        <input type="date" id="id_data" name="data" value="{{ tarefa.data|date:'Y-m-d' }}" class="form-control">
                    </div>
                </div>

                <div class="form-actions">
                    <a href="{% url 'home' %}" class="btn-cancelar">Cancelar</a>
                    <button type="submit" class="btn-salvar">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const selectRecorrencia = document.getElementById('id_recorrencia');
        const blocoData = document.getElementById('bloco_data');

        function gerenciarCalendario() {
            if (selectRecorrencia.value === 'diaria') {
                blocoData.style.display = 'none';
            </div> else {
                blocoData.style.display = 'block';
            }
        }

        // Inicializa o estado correto ao carregar a página
        gerenciarCalendario();

        // Escuta as alterações de repetição
        selectRecorrencia.addEventListener('change', gerenciarCalendario);
    </script>
{% endblock %}
