{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Agenda Fluida</title>
    <link rel="stylesheet" href="{% static 'tarefas/css/auth.css' %}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Crie sua Conta</h1>
            <p>Junte-se a nós e comece a organizar suas tarefas de forma fluida.</p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>

            <div class="auth-footer">
                Já possui uma conta? <a href="{% url 'login' %}">Faça Login</a><br><br>
                <a href="/">← Voltar ao Início</a>
            </div>
        </div>
    </div>
</body>
</html>
