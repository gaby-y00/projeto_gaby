{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agenda Fluida</title>
    <link rel="stylesheet" href="{% static 'tarefas/css/auth.css' %}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Bem-vindo de volta!</h1>
            <p>Preencha as informações abaixo para acessar sua conta.</p>

            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <div class="auth-footer">
                Não tem uma conta? <a href="{% url 'cadastro' %}">Cadastre-se</a><br><br>
                <a href="/">← Voltar ao Início</a>
            </div>
        </div>
    </div>
</body>
</html>
